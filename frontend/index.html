<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Ideanalyze AI — Turn rough ideas into structured, hackathon-ready startup plans. Crafted by Sajal Chaulagain aka Mr. Chaule."
    />
    <title>Ideanalyze AI — Turn ideas into structured plans</title>
    <script>
      // Apply the saved theme before paint so the page does not flash.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Storage can be unavailable; the app falls back to light mode.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
