<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before paint so the page does not flash.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {
        // Storage can be unavailable; the app falls back to light mode.
      }
    </script>
    <title>Ideanalyze AI — Turn Ideas Into Structured Startup Plans</title>
    <meta
      name="description"
      content="Turn a rough idea into a structured startup plan in seconds. Ideanalyze AI breaks any idea into problem, solution, target users, features, tech stack, challenges and next steps. Free to use."
    />
    <link rel="canonical" href="https://ideanalyze.netlify.app/" />
    <meta name="author" content="Sajal Chaulagain" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />

        Ideanalyze AI analyses a rough idea and returns a structured breakdown:
